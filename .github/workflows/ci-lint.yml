name: Lint CI Config

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Validates workflow semantics (expressions, needs/matrix refs, action
      # pinning) and lints embedded shell via shellcheck. The image bundles
      # shellcheck + pyflakes; digest pins the multi-arch 1.7.12 index.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      # YAML hygiene (indentation, trailing whitespace, EOF newline, duplicate
      # keys) across all YAML; config in .yamllint. Pinned to match local.
      - name: yamllint
        run: |
          pipx install yamllint==1.35.1
          yamllint --version
          yamllint .
